name: Windows release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows artifacts (no publishing)
        shell: pwsh
        run: ./scripts/build_windows.ps1 -BuildRoot "$env:RUNNER_TEMP/Roster-Beacon" -OutputDirectory "$env:GITHUB_WORKSPACE/release"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate
          path: release/*
          if-no-files-found: error
